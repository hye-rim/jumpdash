<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>점프 대시</title>
<style>
  /* 아이폰 사파리: 길게 눌러 복사 메뉴가 뜨거나 글자가 선택되지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#000; touch-action:none; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #hint { max-width:360px; text-align:center; font-size:13px; color:#9ab; line-height:1.5; }
  #hint b { color:#ffd23a; }
  /* 창 안의 글자·버튼은 게임 화면 크기에 비례해 커지고 줄어든다 (--s = 화면 너비 / 360) */
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(5px * var(--s,1)); text-align:center; padding:calc(6px * var(--s,1)); background:rgba(4,8,22,.88); overflow:hidden; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:calc(24px * var(--s,1)); font-weight:900; letter-spacing:.03em; color:#7fe0ff; text-shadow:0 2px 0 #0a3a66; line-height:1.15; }
  #overlay h2 { font-size:calc(20px * var(--s,1)); font-weight:900; }
  #overlay p { font-size:calc(11px * var(--s,1)); color:#e6e6e6; line-height:1.5; }
  #overlay p b { color:#ffd23a; font-weight:700; }
  #overlay .big { font-size:calc(22px * var(--s,1)); font-weight:900; color:#ffd23a; }
  #overlay button { background:linear-gradient(180deg,#b8e6ff,#2f8fe0); color:#04223f; font-weight:900; font-size:calc(14px * var(--s,1)); border:none; border-radius:999px; padding:calc(7px * var(--s,1)) calc(20px * var(--s,1)); box-shadow:0 calc(3px * var(--s,1)) 0 #0a4a8a; cursor:pointer; }
  #overlay button:active { transform:translateY(2px); box-shadow:0 1px 0 #0a4a8a; }
  #overlay button.sub { background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.3); font-size:calc(12px * var(--s,1)); padding:calc(5px * var(--s,1)) calc(14px * var(--s,1)); }
  #overlay button.opt { padding:calc(4px * var(--s,1)) calc(12px * var(--s,1)); font-size:calc(11px * var(--s,1)); background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.3); }
  #overlay button.opt.on { background:rgba(255,210,58,.5); border-color:#ffd23a; }
  #overlay .levels { display:flex; gap:calc(7px * var(--s,1)); justify-content:center; flex-wrap:wrap; }
  #overlay .levels button { display:flex; flex-direction:column; align-items:center; gap:0; padding:calc(5px * var(--s,1)) calc(10px * var(--s,1)); min-width:calc(84px * var(--s,1)); font-size:calc(12px * var(--s,1)); line-height:1.25; }
  #overlay .levels button small { font-size:calc(10px * var(--s,1)); font-weight:700; color:#0a4a8a; }
  #overlay .levels button.done small { color:#0a6a2a; }
  #overlay .opts { display:flex; gap:calc(8px * var(--s,1)); justify-content:center; flex-wrap:wrap; }
  #overlay .keys { font-size:calc(10px * var(--s,1)); color:#9ab; }
  #top { position:absolute; right:3px; top:3px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:calc(28px * var(--s,1)); height:calc(28px * var(--s,1)); border-radius:8px; font-size:calc(12px * var(--s,1)); cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>점프 대시</h1>
      <p>화면을 <b>누르면 점프</b>! 가시를 넘고 블록을 타고 끝까지 가요 🏁<br>누르고 있으면 <b>계속 뛰어요</b>. 박자에 맞춰 달려요</p>
      <div class="levels" id="levels"></div>
      <div class="opts">
        <button class="opt" data-act="practice"></button>
      </div>
    </div>
  </div>
  <div id="hint">폰을 <b>가로</b>로 돌리면 화면이 더 커요</div>
</div>
<script src="levels.js"></script>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
